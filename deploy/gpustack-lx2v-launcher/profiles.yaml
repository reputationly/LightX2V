# LightX2V launcher profiles — measured, fixed per (model_cls, gpu_count).
# Source of truth: gpustack docs/lightx2v-backend-design.md §3 / §3.2.
#
# config_json points at configs baked INTO this image. The engine app image
# (dockerfiles/Dockerfile_aarch64_app) does `COPY . /opt/LightX2V`, so every
# repo config is available at /opt/LightX2V/configs/... at runtime — no NFS
# dependency for profiles. Calibrating a profile = edit config here + rebuild
# the engine image; GPUStack is never touched.
#
# The launcher keys on model_cls (inferred from the model path or --model-cls),
# picks the variant whose `gpus` matches the container's GPU count, and asserts
# cfg_p_size * seq_p_size (or tensor_p_size) == gpus.

z_image:
  variants:
    - name: z-image/a100-sdpa
      gpus: 1
      task: t2i
      # infer_steps=9, attn_type=torch_sdpa, enable_cfg=false, rope_type=torch.
      # Uses torch_sdpa (NOT sage_attn2): the A100 image ships no compiled
      # sageattention, so sage_attn2 falls back / gives no speedup — see the
      # Z-Image experiment report §5.1 and commit a169c04a. z_image VRAM is
      # ample (bf16 ~21.8G/40G), so int8/multi-card are unnecessary.
      config_json: /opt/LightX2V/configs/z_image/z_image_a100_sdpa.json
      # Optional warmup so the first real request is hot. Verify the body first.
      # warmup:
      #   endpoint: /v1/tasks/image/sync
      #   timeout: 600
      #   body: {prompt: "warmup", aspect_ratio: "1:1"}

# IMPORTANT (all multi-GPU variants): the parallel mesh MUST live in the config
# JSON's "parallel" block — the engine reads config["parallel"], and top-level
# CLI args do NOT configure parallelism (set_config.py). The seq_p_size /
# cfg_p_size fields on a variant are ADVISORY (the launcher only uses them to
# validate the GPU count); they must MIRROR the JSON. Never use the
# disaggregated "sub_servers" layout (fixed ports 9000-9004) — those collide
# across co-located instances on the shared host network; use a single
# in-process torchrun server.
#
# GPUStack side: multi-GPU profiles must be deployed with
# gpu_selector.gpus_per_replica (or pinned gpu_ids) — the LightX2V resource-fit
# selector reads it to reserve whole GPUs (defaults to 1 GPU/replica otherwise).

# Wan2.2 T2V (Wan2.2-T2V-A14B). Production calibration from the Wan2.2 T2V
# runbook (gpustack docs/lightx2v-gpustack-部署实录.md §12.2, measured on
# dev-gpustack-a100-0002): int8 4-card ulysses is the production optimum —
# int8 single-card runs but is slow, bf16 multi-card CPU-OOMs (4 ranks ×
# (57G+11G) > 256G). ~35G/GPU at seq_p=4; 480p long-form, 720p caps at 161
# frames; frames must be 4n+1.
wan2.2_moe:
  variants:
    - name: wan2.2-t2v/int8-4card
      gpus: 4
      task: t2v
      config_json: /opt/LightX2V/configs/deploy/wan22_t2v_int8_4card_a100.json
      # advisory (validated against gpus; real mesh lives in config_json.parallel)
      seq_p_size: 4
      seq_p_attn_type: ulysses
      cfg_p_size: 1

# Wan2.2 I2V — the launcher maps model paths containing i2v/flf2v to this
# DISTILL cls (docs/Wan2.2-I2V-实验测试报告.md: model_cls=wan2.2_moe_distill,
# task=i2v or flf2v). Same production shape as T2V: int8 4-card ulysses
# (~33-35G/GPU), int8 single-card OOMs at 720p, bf16 multi-card CPU-OOMs.
# int8 DiT ckpts live on shared NFS (models-int8/).
#
# DEPLOY NOTE: there is no separate I2V base dir — the I2V pipeline takes
# VAE/T5 from the T2V base (report §2), so deploy with
#   Model Path = .../models/Wan-AI/Wan2.2-T2V-A14B
#   I2V backend parameters:  --model-cls wan2.2_moe_distill --task i2v
#   FLF2V backend parameters: --model-cls wan2.2_moe_distill --task flf2v
# (without them the launcher infers t2v from the path and fails loudly).
# FLF2V uses the same weights but a separate task/profile so sample_shift=16
# stays a startup-time production setting rather than a per-request override.
# Like T2V/I2V, it generates at native 16fps and applies RIFE post-processing
# to output 32fps by default. Clients can explicitly request target_fps=16 to
# keep the native frames without interpolation.
wan2.2_moe_distill:
  variants:
    - name: wan2.2-i2v/int8-4card
      gpus: 4
      task: i2v
      config_json: /opt/LightX2V/configs/deploy/wan22_i2v_int8_4card_a100.json
      # advisory (validated against gpus; real mesh lives in config_json.parallel)
      seq_p_size: 4
      seq_p_attn_type: ulysses
      cfg_p_size: 1
    - name: wan2.2-flf2v/int8-4card-shift16
      gpus: 4
      task: flf2v
      config_json: /opt/LightX2V/configs/deploy/wan22_flf2v_int8_4card_a100.json
      # advisory (validated against gpus; real mesh lives in config_json.parallel)
      seq_p_size: 4
      seq_p_attn_type: ulysses
      cfg_p_size: 1

# Qwen-Image-Edit-2511 (i2i editing). Production calibration from
# docs/Qwen-Image-Edit实验测试报告.md: Lightning offline-merged 8-step +
# qwen25vl_cpu_offload=false (text encoder stays on GPU — offloaded to the ARM
# CPU the VLM forward takes ~7min and looks like a hang) = 21.6s/image hot,
# single GPU, attn MUST be torch_sdpa (sage_attn2 black-images).
# Deploy the MERGED model dir as Model Path; the merged DiT safetensors path is
# pinned in the config JSON (shared NFS).
# ⚠️ Host-memory red line: the block-offloaded DiT keeps ~60G Shmem per
# instance — cap at 2 replicas per 251G node for mixed traffic (3 absolute
# max, the 4th gets OOM-killed). This is a per-NODE cap the scheduler cannot
# see (it books VRAM, not host Shmem) — enforce it at deploy time.
# Both variants are 1-GPU, so the launcher disambiguates by TASK: model paths
# containing "edit" resolve to i2i; otherwise pass --task t2i / --task i2i as a
# backend parameter at deploy time (ambiguity fails loudly, never guesses).
qwen_image:
  variants:
    - name: qwen-image-edit-2511/lightning-merged-8step
      gpus: 1
      task: i2i
      config_json: /opt/LightX2V/configs/deploy/qwen_edit_2511_lightning_merged_a100.json
    # Qwen-Image t2i (docs/Qwen-Image-实验测试报告.md): bf16 merged 8-step +
    # qwen25vl_cpu_offload=false = 17.0s/image hot, single GPU, torch_sdpa only
    # (sage_attn2 NaN-black-images). Same ~60G-Shmem-per-instance host-memory
    # red line as edit: cap 2 replicas per 251G node for mixed traffic
    # (3 absolute max; the 4th wedges the node — enforce at deploy time, the
    # scheduler only books VRAM).
    - name: qwen-image-2512/lightning-merged-8step
      gpus: 1
      task: t2i
      config_json: /opt/LightX2V/configs/deploy/qwen_2512_lightning_merged_a100.json

# InfiniteTalk digital human (audio-driven video, task=s2v). Production shapes
# from the 现网部署清单 (2026-07-11): both tiers run 4-card ulysses × 1
# instance/node (latency-first, user decision 2026-07-11). 480p ≈ 54.4s/5s
# clip, 720p ≈ 136.7s/5s clip. Single-DiT model, so load_from_rank0 is safe
# (MoE models must NOT use it) and speeds up loading.
#
# ⚠️ BOTH variants are (infinitetalk, 4 GPUs, s2v) — GPU count and task cannot
# disambiguate them. Deploys MUST pin the tier explicitly:
#   backend parameters: --model-cls infinitetalk --profile infinitetalk-480p/int8-4card
#   (or .../infinitetalk-720p/int8-4card)
# Duration red lines are enforced UPSTREAM (gateway/new-api limits per tier):
# 480p ≤60-75s audio, 720p start at ≤25-30s (frame volume is 3×; config
# video_duration=30 caps the default).
# Model Path = the Wan2.1 distill base dir (VAE/T5/CLIP); the tier's int8 DiT
# and the InfiniteTalk adapter are pinned inside the config JSON (shared NFS).
infinitetalk:
  variants:
    - name: infinitetalk-480p/int8-4card
      gpus: 4
      task: s2v
      config_json: /opt/LightX2V/configs/infinitetalk/a100/infinitetalk_480p_ul4_distilled_int8triton.json
      # advisory (validated against gpus; real mesh lives in config_json.parallel)
      seq_p_size: 4
      seq_p_attn_type: ulysses
      cfg_p_size: 1
    - name: infinitetalk-720p/int8-4card
      gpus: 4
      task: s2v
      config_json: /opt/LightX2V/configs/deploy/infinitetalk_720p_4card_a100.json
      # advisory (validated against gpus; real mesh lives in config_json.parallel)
      seq_p_size: 4
      seq_p_attn_type: ulysses
      cfg_p_size: 1

# SeedVR2-3B video super-resolution (task=sr). Atomic capability (ruling
# upgraded 2026-07-11): single card, bf16, ≤121 frames per seamless segment
# (longer inputs auto-segment; the PyAV segment-pts bug is fixed in this
# release). 480p→2× ≈ 80s, 720p→2× ≈ 200s. sr_ratio is a request-level field
# (default 2.0), output clamped by the config's target size (runner:114).
# VFI: request target_fps > source fps triggers per-segment RIFE on the SR
# output (boundary-stitched; target_fps <= source is a strict no-op, never
# drops frames). Requires the config's video_frame_interpolation block and
# the RIFE weights mounted at /nfs-data/models/rife-model/flownet.pkl —
# startup fails fast if the block is present but weights are missing.
# Resources: ~22.7G VRAM peak, ~42G host per instance — pairs with VACE on one
# node (2×VACE + 2×SeedVR2; watch MemAvailable, that node runs near the line).
# Input cap (≤720p in) is enforced upstream (gateway/new-api), not here.
seedvr2:
  variants:
    - name: seedvr2-3b/seg121-1card
      gpus: 1
      task: sr
      config_json: /opt/LightX2V/configs/seedvr/a100/seedvr2_3b_seg121.json
    # 4-card segment data parallelism: the same segmentation as the 1-card
    # variant, with the segments dealt round-robin across ranks and only the
    # 8-frame cross-fade boundary sent rank-to-rank. Output is BIT-IDENTICAL to
    # 1-card (PSNR inf, measured) because each segment's noise is keyed on
    # (seed, global segment index) rather than drawn from the global RNG.
    # Speedup is segments/ceil(segments/4), so it is a function of INPUT LENGTH:
    # ≤121 frames = 1 segment = no gain (the request is pinned to rank 0);
    # 122-234 = 2; 235-347 = 3; 348-460 = 4.
    # Measured on 4×A100-40G against THIS config, warm server, 24 requests from
    # 832x480 and 1344x768 sources (both land on 1920x1104 -- SR resizes to the
    # target first, so the source resolution costs nothing): 124f 96s /
    # 243f 121-126s / 362f 137-143s, peak 31.9G VRAM per card out of 40.9G.
    # That 78% is the binding constraint and it is set by sr_segment_length
    # alone -- not by clip length, source resolution, or how many segments a
    # rank owns, which are all released between segments (seg 48 measured 20.2G
    # peak, +48% wall). A higher target resolution needs seg length lowered.
    # Host RAM runs ~145G of 251G with four ranks working, so requests MUST stay
    # serialized: server/task_manager.py's single _processing_lock is the only
    # thing enforcing that. Never place a second replica on the same box.
    # No video_frame_interpolation block on purpose: RIFE's global target-frame
    # grid is a real sequential dependency across segments, so enabling it makes
    # the runner fall back to rank 0 and throw away all four cards. It is inert
    # in the 1-card config too (target_fps 16 is never > source fps).
    - name: seedvr2-3b/seg121-4card
      gpus: 4
      task: sr
      config_json: /opt/LightX2V/configs/seedvr/a100/seedvr2_3b_segp4.json
      # advisory (validated against gpus; real mesh lives in config_json.parallel)
      seg_p_size: 4

# Wan2.2 VACE video editing, atomic tier (task=vace): single-card offload,
# int8-triton, 4-step Lightning LoRA (13× speedup, P8/P9), native 720p + RIFE
# 32fps. ~418s single / ~485s per instance with two instances (measured under
# load). Inputs: src_video / src_mask / src_ref_images (V2V / MV2V / R2V modes).
# ⚠️ Host-memory red line: each instance pins ~55G host RAM (offload) — HARD
# cap 2 instances/node (4-instance test: host at 61MB free + cold-start NFS
# read storms, 3×T5 took 18min). Stagger instance starts ≥2min apart.
# The scheduler books VRAM only — enforce the per-node cap at deploy time.
# Model Path contains "vace" → model_cls infers wan2.2_moe_vace (checked before
# the generic "wan" branch); the canvas-tier 480p config
# (wan22_moe_vace_a100_int8_lora4step.json) is kept on file but NOT deployed
# until the canvas ships.
wan2.2_moe_vace:
  variants:
    - name: wan2.2-vace/int8-lora4step-720p-1card
      gpus: 1
      task: vace
      config_json: /opt/LightX2V/configs/wan22/a100/wan22_moe_vace_a100_int8_lora4step_720p_rife.json

# LTX-2.3 v2a pure dubbing (task=v2a): freeze the source-video latents, denoise
# audio ONLY, then stream-copy the ORIGINAL pixels at mux (-c:v copy) — output
# is the input video with an AI audio track, picture byte-identical.
# Single card bf16: the 22B DiT OOMs on 40G A100 under both ulysses and TP
# (measured); v2a skips the upsampler and never denoises video, so VRAM sits
# below the generation tasks — exact peak/latency pending the M0 smoke run
# (also feeds gpustack's lightx2v_model_latency_seconds entry and pricing).
# Input red lines are enforced UPSTREAM (gateway VideoModelConfig): suggested
# launch caps ≤720p in, ≤15s (engine warns >361 frames). Non-24fps sources are
# tempo-aligned at mux (atempo) — sync is exact, but ~24fps material is best.

# SwiftVR:实时一步式视频修复(骨架 Wan2.2-TI2V-5B)。
# 目标分辨率由请求给,一个实例串行吃 1080p/2K/4K,切换不用重启(已实测,含跑完 4K
# 再回 1080p 无劣化)。但两条路的封顶规则不同,配置里那四个尺寸字段管的就是这个:
#   - 只给 sr_ratio(网关默认路径,前端固定发 4.0 当"够不着的上限")
#     → 封到 target_height/target_width 这一档(1080P),按源朝向配对长短边。
#       这是现网 SR 的既有契约,SeedVR2 也是这么干的;不封的话 768p 源乘 4 会去出
#       5376x3072,远超 4K/33G 的实测上限,必 OOM。
#   - 显式给 target_shape(SwiftVR 独有,SeedVR2 不读这个字段)
#     → 放行,2K/4K 就靠它;只过 max_target_* 的显存护栏(4K),超了等比压回并告警。
# 显存(1080p / 2K / 4K):单卡 15.8G / 19.8G / 32.5G;四卡每卡 16.0G / 19.8G / 33.2G。
# ⚠️ 混部按最高档 33G 算:PyTorch 缓存分配器不归还,实例处理过 4K 之后占用不再降。
# ⚠️ 高速运动素材(飞溅/粒子)上 SwiftVR 会压低运动细节(运动能量相对源 -8.7%,
#    SeedVR2 是 +12%),这是 ReAE 时间轴 4x 下采样的架构代价,配置调不动
#    (clip_len 24->96、dit_overlap 0->4 实测均无改善)。那类素材仍走 SeedVR2。
swiftvr:
  variants:
    - name: swiftvr/1card
      gpus: 1
      task: sr
      config_json: /opt/LightX2V/configs/swiftvr/a100/swiftvr.json
    # 段级数据并行:整段按 chunk **连续**切给各 rank(连续而非轮转,这样每个 rank 只需
    # 在自己区间开头预热一次 ReAE 因果状态),末尾按块号 concat 并校验总帧数。
    # 单请求 1080p 23s->11s、2K 37s->18s、4K 78s->32s(2.1~2.4x)。
    # 注意:**吞吐上 4 个单卡实例仍然更划算**(线性 4x,零通信),四卡只赢单请求延迟。
    - name: swiftvr/segp4
      gpus: 4
      task: sr
      config_json: /opt/LightX2V/configs/swiftvr/a100/swiftvr_segp4.json
      seg_p_size: 4

ltx2:
  variants:
    - name: ltx2-v2a/bf16-1card
      gpus: 1
      task: v2a
      config_json: /opt/LightX2V/configs/ltx2/a100/ltx2_3_v2a.json
