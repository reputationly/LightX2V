# LightX2V launcher profiles — measured, fixed per (model_cls, gpu_count).
# Source of truth: gpustack docs/lightx2v-backend-design.md §3 / §3.2.
#
# config_json points at configs baked INTO this image. The engine app image
# (dockerfiles/Dockerfile_aarch64_app) does `COPY . /opt/LightX2V`, so every
# repo config is available at /opt/LightX2V/configs/... at runtime — no NFS
# dependency for profiles. Calibrating a profile = edit config here + rebuild
# the engine image; GPUStack is never touched.
#
# The launcher keys on model_cls (inferred from the model path or --model-cls),
# picks the variant whose `gpus` matches the container's GPU count, and asserts
# the declared parallel axes equal gpus: cfg_p_size * seq_p_size * tensor_p_size
# for the mesh models, or seg_p_size (SeedVR2) / chunk_p_size (SwiftVR) alone for
# the SR models — those two are exclusive with every mesh axis.
#
# 2026-11 上游同步后，本文件只保留两个模型：视频生成/编辑能力已迁到 vLLM-Omni，
# 其余 LightX2V model 一律用上游实现、不再由本引擎提供 profile。按模型扩容会在
# _load_profile 阶段明确报错退出（期望行为），不会静默起错服务。

# SeedVR2-3B video super-resolution (task=sr). Atomic capability (ruling
# upgraded 2026-07-11): single card, bf16, ≤121 frames per seamless segment
# (longer inputs auto-segment; the PyAV segment-pts bug is fixed in this
# release). 480p→2× ≈ 80s, 720p→2× ≈ 200s. sr_ratio is a request-level field
# (default 2.0); the output is capped by the config's `size` area, and a request
# may name its own `size` instead (upstream #1523) — see seedvr_runner's
# _oriented_target/_build_video_transform.
# Resources: ~22.7G VRAM peak, ~42G host per instance.
# Input cap (≤720p in) is enforced upstream (gateway/new-api), not here.
# RIFE/VFI 已随上游删除（D6）：帧率按源透传，需要更高帧率请走生成能力自带的插帧。
seedvr2:
  variants:
    - name: seedvr2-3b/seg121-1card
      gpus: 1
      task: sr
      config_json: /opt/LightX2V/configs/seedvr/a100/seedvr2_3b_seg121.json
    # 4-card segment data parallelism: the same segmentation as the 1-card
    # variant, with the segments dealt round-robin across ranks and only the
    # 8-frame cross-fade boundary sent rank-to-rank. Each segment's noise is
    # keyed on (seed, global segment index) rather than drawn from the global RNG.
    # ⚠️ 4 卡与 1 卡的成片**不是逐位相同**:实测 finite_mean ≈ 48.2 dB、124 帧中仅前 9 帧
    #    逐位相同,其余差异全片均匀(最差帧落在 cross-fade 重叠区与尾部)。已确认与
    #    VAE 分块上限无关(vae_memory_limit_gb 0 与 0.5 同值),根因未定位 —— 已另开单。
    #    同一个例子在现网镜像上也是这个量级,所以不是本次上游同步引入的。
    # Speedup is segments/ceil(segments/4), so it is a function of INPUT LENGTH:
    # ≤121 frames = 1 segment = no gain (the request is pinned to rank 0);
    # 122-234 = 2; 235-347 = 3; 348-460 = 4.
    # Measured on 4×A100-40G against THIS config, warm server, 24 requests from
    # 832x480 and 1344x768 sources (both land on 1920x1104 -- SR resizes to the
    # target first, so the source resolution costs nothing): 124f 96s /
    # 243f 121-126s / 362f 137-143s, peak 31.9G VRAM per card out of 40.9G.
    # That 78% is the binding constraint and it is set by sr_segment_length
    # alone -- not by clip length, source resolution, or how many segments a
    # rank owns, which are all released between segments (seg 48 measured 20.2G
    # peak, +48% wall). A higher target resolution needs seg length lowered.
    # Host RAM runs ~145G of 251G with four ranks working, so requests MUST stay
    # serialized: server/task_manager.py's single _processing_lock is the only
    # thing enforcing that. Never place a second replica on the same box.
    - name: seedvr2-3b/seg121-4card
      gpus: 4
      task: sr
      config_json: /opt/LightX2V/configs/seedvr/a100/seedvr2_3b_segp4.json
      # advisory (validated against gpus; real mesh lives in config_json.parallel)
      seg_p_size: 4

# SwiftVR:实时一步式视频修复(骨架 Wan2.2-TI2V-5B)。
# 目标分辨率由请求给,一个实例串行吃 1080p/2K/4K,切换不用重启(已实测,含跑完 4K
# 再回 1080p 无劣化)。三条尺寸路的优先级与封顶规则:
#   - 只给 sr_ratio(网关默认路径,前端固定发 4.0 当"够不着的上限")
#     → 封到 sr_tier_size 这一档(1080P),按源朝向配对长短边,超档出精确档位尺寸。
#       这是现网 SR 的既有契约;不封的话 768p 源乘 4 会去出 5376x3072,远超 4K/33G
#       的实测上限,必 OOM。
#   - target_short_edge(网关按"只有引擎知道源有多大"下发)
#     → 输出按源的真实画幅等比放大,短边精确命中目标档,画幅零形变。
#   - 显式给 size(SwiftVR 独有,SeedVR2 读的是同一字段但走自己的面积封顶)
#     → 放行,2K/4K 就靠它;只过 max_target_* 的显存护栏(4K),超了等比压回并告警。
# 显存(1080p / 2K / 4K):单卡 15.8G / 19.8G / 32.5G;四卡每卡 16.0G / 19.8G / 33.2G。
# ⚠️ 混部按最高档 33G 算:PyTorch 缓存分配器不归还,实例处理过 4K 之后占用不再降。
# 📌 2026-08-28 拍板:SR 全量走 SwiftVR,不做素材分流。SeedVR2 保留作回退路径。
# ⚠️ 已知短板(已接受):细小高速飞溅/粒子(火花、木屑、水花)上 SwiftVR 会压低运动细节
#    (木工特写实测 -8.7%,SeedVR2 是 +12%),观感是颗粒"弹出来"。根因是 ReAE 时间轴
#    4x 下采样吃掉亚像素尺度的小目标,clip_len 24->96、dit_overlap 0->4、upscale_mode
#    四种实测均无改善。收到"颗粒弹出"类反馈时可针对性切回 SeedVR2。
#    **别按运动剧烈程度理解这个短板**:四素材补测里运动最剧烈的雨夜奔跑反而 +2.3%
#    (最贴近源,已肉眼复核),大面积连贯位移不受影响;锐度 SwiftVR 四条全胜。
# 不开 use_compile:冷编译 +20s,稳态每块才快 17%(单请求省 2.8s),约 7 个同分辨率
#    请求才摊平;且编译缓存 key 不含形状,换分辨率必重编译,与"一份配置吃全分辨率"相冲。
# upscale_mode 保持默认 bilinear:四种全测过,它在锐度与运动保留上同时最优。
# 2026-09-05 起默认走**反相双跑**配置(antiphase_dual_pass + antiphase_strength_gain=1.4)。
# 买的是 2beat:ReAE 解码器最后一个 TemporalGrow 把 3 抽头时间卷积关在每一对帧内部,
# 输出帧天生两两成对,匀速素材也「走两帧顿一下」—— 这是上游那份闪烁投诉的根因。
# 把输入整体移 1 帧再跑一遍、两路平均即可对消,gain=1.4 补回平均削掉的高频。
# 四素材验收:锐度 99.0~118.7%(不降反升三条)、2beat 偏离源 0.13~0.33 收到 0.0003~0.028。
# 代价随分辨率涨(restore 阶段确实翻倍,占比越大端到端越吃亏):
#   1080p 4卡 13.6~15.1s -> 16.6~17.2s(约 1.1~1.3x),显存/卡 13.54 -> 14.04 GiB
#   2K    4卡 16.6s      -> 29.6s     (1.79x),        显存/卡 16.71 -> 17.58 GiB
# 不满意可随时回退:把 config_json 换回同目录不带 _antiphase 的那两份即可,
# 关掉开关时输出与改造前 **md5 逐位相同**(已验)。
swiftvr:
  variants:
    - name: swiftvr/1card
      gpus: 1
      task: sr
      config_json: /opt/LightX2V/configs/swiftvr/a100/swiftvr_antiphase.json
    # 多卡改用上游 chunk_p_size:块按 rank 轮转分配,ReAE 每一层的因果边界经 ring P2P
    # 与相邻 rank 交换(数学上与单卡等价),不再有"每个 rank 在自己区间开头重跑预热块"
    # 的冗余算力。变体名 swiftvr/segp4 保持不变 —— GPUStack 的 model(46)按
    # --profile swiftvr/segp4 引用它。
    # ⚠️ 反相双跑在块并行下靠**跨 rank carry** 传帧:块 k 在 rank k%P,解码后把本块
    #    直相的最后一帧经 exchange_chunk_boundary 发给下一个 rank,rank0 收到的
    #    (来自 rank P-1)留给下一个 batch 用。全局 chunk.index==0 的 carry 恒为 None。
    - name: swiftvr/segp4
      gpus: 4
      task: sr
      config_json: /opt/LightX2V/configs/swiftvr/a100/swiftvr_antiphase_segp4.json
      chunk_p_size: 4
