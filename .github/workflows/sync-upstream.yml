name: Sync Upstream

# 每日从 ModelTC/LightX2V 同步到 fork —— 但**不再直接推 main**(决策 D5):
#   1. 合并结果进独立分支 sync/upstream-<YYYYMMDD>,并开 PR 等人工评审;
#   2. 不再 push main,也不再自动触发镜像构建 —— 镜像只在验收通过后手工构建
#      (build-arm64-docker.yml 的 push_latest 默认 false,浮动 tag 不再被动挪动);
#   3. 有冲突时**同样开 PR**(标题标注 CONFLICT,正文列出冲突文件),而不是
#      abort 之后静默失败 —— 静默失败才是上游同步断掉的主要原因。
on:
  schedule:
    - cron: "17 18 * * *"   # 每天 UTC 18:17 (北京时间 02:17)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.merge.outputs.branch }}
      conflict: ${{ steps.merge.outputs.conflict }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream/main into a sync branch
        id: merge
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ModelTC/LightX2V.git || true
          git fetch upstream

          branch="sync/upstream-$(date -u +%Y%m%d)"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          git switch -c "${branch}"

          if git merge upstream/main --no-edit -m "chore: sync upstream $(date -u +%Y-%m-%d)"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            conflicted="$(git diff --name-only --diff-filter=U | sort)"
            echo "::warning::upstream merge conflicts in: ${conflicted}"
            git merge --abort
            note="docs/upstream-sync-conflict-$(date -u +%Y%m%d).md"
            {
              echo "# 上游同步冲突 $(date -u +%Y-%m-%d)"
              echo
              echo "自动合并 upstream/main 失败,以下文件需要人工解决(本 PR 只含这份清单,不含任何代码改动):"
              echo
              echo '```'
              echo "${conflicted}"
              echo '```'
              echo
              echo "本地复现:git fetch upstream && git merge upstream/main"
            } > "${note}"
            git add "${note}"
            git commit -m "chore(sync): upstream $(date -u +%Y-%m-%d) 合并冲突，需人工解决"
          fi

      - name: Push sync branch
        shell: bash
        run: git push --force-with-lease origin "${{ steps.merge.outputs.branch }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
        shell: bash
        run: |
          title="chore(sync): upstream $(date -u +%Y-%m-%d)"
          if [ "${CONFLICT}" = "true" ]; then
            title="${title} — CONFLICT，需人工解决"
            body="自动合并在冲突处停止,详见 PR 内的清单文件。合并不完整,**不要直接合并本 PR**。"
          else
            body="自动合并成功。合并前请逐项确认:audit_our_config_keys.py 退出 0;白名单外的 lightx2v/ 与上游逐字节一致;import 冒烟通过;SR 画质/性能验收通过后再构建镜像。"
          fi
          if gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number' | grep -q .; then
            echo "PR already open for ${BRANCH}; left as is"
          else
            gh pr create --head "${BRANCH}" --base main --title "${title}" --body "${body}"
          fi
